name: Quick Print OS 3.2.1 Live Integration Smoke

on:
  push:
    branches: [ "quickprint-build-relay" ]
    paths:
      - ".github/workflows/quickprint-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify public integrations used by Quick Print OS
        shell: bash
        run: |
          set -euo pipefail

          fetch_json() {
            local name="$1"
            local url="$2"
            local out="$3"
            curl --compressed -fsSL --retry 3 --connect-timeout 15 --max-time 40 \
              -H 'User-Agent: QuickPrintOS/3.2.1 audit' \
              -H 'Accept: application/json' \
              "$url" -o "$out"
            python -m json.tool "$out" >/dev/null
            echo "PASS $name: $(wc -c < "$out") bytes"
          }

          fetch_json "BrasilAPI CEP" "https://brasilapi.com.br/api/cep/v2/08683000" /tmp/cep.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/cep.json'))
          assert str(d.get('cep','')).replace('-','') == '08683000'
          PY

          fetch_json "BrasilAPI CNPJ" "https://brasilapi.com.br/api/cnpj/v1/00000000000191" /tmp/cnpj.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/cnpj.json'))
          assert d.get('cnpj')
          PY

          fetch_json "IBGE estados" "https://servicodados.ibge.gov.br/api/v1/localidades/estados?orderBy=nome" /tmp/uf.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/uf.json'))
          assert any(x.get('sigla') == 'SP' for x in d)
          PY

          fetch_json "IBGE municípios SP" "https://servicodados.ibge.gov.br/api/v1/localidades/estados/SP/municipios?orderBy=nome" /tmp/cities.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/cities.json'))
          assert any(x.get('nome') == 'Suzano' for x in d)
          PY

          fetch_json "PNCP propostas" "https://pncp.gov.br/api/consulta/v1/contratacoes/proposta?dataFinal=20260920&pagina=1&tamanhoPagina=10" /tmp/pncp.json
          fetch_json "Compras.gov preços" "https://dadosabertos.compras.gov.br/modulo-pesquisa-preco/3_consultarServico?pagina=1&tamanhoPagina=10&codigoItemCatalogo=8599" /tmp/compras.json

      - name: Verify fiscal and shipping hosts are reachable over TLS
        shell: bash
        run: |
          set -euo pipefail
          probe_tls() {
            local name="$1"
            local url="$2"
            local code
            code="$(curl -sS -L --retry 3 --retry-all-errors --connect-timeout 15 --max-time 45 \
              -A 'QuickPrintOS/3.2.1 audit' -o /dev/null -w '%{http_code}' "$url")"
            test "$code" != "000"
            echo "PASS $name: TLS/host reachable, HTTP $code"
          }
          probe_tls "NFS-e produção restrita" "https://sefin.producaorestrita.nfse.gov.br/API/SefinNacional"
          probe_tls "NFS-e produção" "https://sefin.nfse.gov.br/SefinNacional"
          probe_tls "NFS-e parametrização" "https://adn.nfse.gov.br/parametrizacao"
          probe_tls "Melhor Envio sandbox" "https://sandbox.melhorenvio.com.br"
          probe_tls "Melhor Envio produção" "https://melhorenvio.com.br"
