name: Quick Print OS PR29 Signed Release

on:
  push:
    branches: [ "quickprint-build-relay" ]
    paths:
      - ".github/workflows/quickprint-apk-relay.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-pr29:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_URL: "https://quickprint-android-0sg3.hatchable.site/api/qp28-source?_preview=eyJzbHVnIjoicXVpY2twcmludC1hbmRyb2lkLTBzZzMiLCJleHAiOjE3OTAwNTM5MjAsInJvbGUiOiJwdWJsaWMifQ.b465a73adf9ba5cf2a002425ba84a4ad15a9579b2ceea48b7872cefe88b95d0e"
      SOURCE_SHA256: "d807f4e036f472f5e5b6cb2a50cd5a13ced7fe8411e16cbeb62c84758bd349ea"
      KEY_URL: "https://quickprint-build.hatchable.site/api/key?_preview=eyJzbHVnIjoicXVpY2twcmludC1idWlsZCIsImV4cCI6MTc5MDA1MzkxOCwicm9sZSI6InB1YmxpYyJ9.099f7fe823a782c07dca83261d8a96bdd88d6453bcbf90e2d6f0a823508682e4"
      EXPECTED_CERT_SHA256: "29c27b8a9d6630416cbc6f366241c42fe69d6e5746d2ff768b745858a3810f71"
      APP_DIR: "/tmp/qp29"

    steps:
      - uses: actions/checkout@v4

      - name: Obtain protected build passphrase
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -L --fail --retry 3 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=quickprint-build")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          KEY_JSON="$(curl -L --fail --retry 3 -X POST -H "Authorization: Bearer $OIDC_TOKEN" "$KEY_URL")"
          printf '%s' "$KEY_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["passphrase"])' > /tmp/qp28.pass
          chmod 600 /tmp/qp28.pass
          test -s /tmp/qp28.pass

      - name: Download and decrypt exact PR28 source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 "$SOURCE_URL" -o /tmp/qp28.gcm
          echo "$SOURCE_SHA256  /tmp/qp28.gcm" | sha256sum -c -
          node <<'NODE'
          const fs=require('fs'), crypto=require('crypto');
          const b=fs.readFileSync('/tmp/qp28.gcm');
          if(b.subarray(0,8).toString()!=='QPGCM002') throw new Error('bad source payload');
          const salt=b.subarray(8,24), iv=b.subarray(24,36), body=b.subarray(36);
          const tag=body.subarray(body.length-16), cipher=body.subarray(0,body.length-16);
          const pass=fs.readFileSync('/tmp/qp28.pass','utf8').trim();
          const key=crypto.pbkdf2Sync(pass,salt,250000,32,'sha256');
          const d=crypto.createDecipheriv('aes-256-gcm',key,iv); d.setAuthTag(tag);
          fs.writeFileSync('/tmp/qp28.json',Buffer.concat([d.update(cipher),d.final()]));
          NODE
          rm -rf "$APP_DIR" && mkdir -p "$APP_DIR"
          python <<'PY'
          import base64,json
          from pathlib import Path
          root=Path("/tmp/qp28").resolve()
          obj=json.loads(Path("/tmp/qp28.json").read_text())
          assert obj["format"]=="QPPR28-2"
          assert obj["head"]=="2209bf509affa0483dc5175e3e4116efcc850467"
          assert len(obj["files"])==184
          for item in obj["files"]:
              rel=Path(item["path"])
              if rel.is_absolute() or ".." in rel.parts: raise RuntimeError(rel)
              p=(root/rel).resolve()
              if root not in p.parents: raise RuntimeError(rel)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(base64.b64decode(item["b64"],validate=True))
          PY
          rm -f /tmp/qp28.gcm /tmp/qp28.json
          grep -Fq 'versionCode = 21' "$APP_DIR/app/build.gradle.kts"
          grep -Fq 'versionName = "3.2.0"' "$APP_DIR/app/build.gradle.kts"

      - name: Apply authenticated exact PR29 delta
        shell: bash
        env:
          OVERLAY_URL: "https://quick-print-build.hatchable.site/api/qp29-overlay?_preview=eyJzbHVnIjoicXVpY2stcHJpbnQtYnVpbGQiLCJleHAiOjE3OTAwNTM4NDUsInJvbGUiOiJwdWJsaWMifQ.85db72f26ed71e2981ee2bd14455cbb4636062746e32b9f7baf44a33b3c4f187"
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -L --fail --retry 3 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=quickprint-build-vault")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl -L --fail --retry 3 -H "Authorization: Bearer $OIDC_TOKEN" "$OVERLAY_URL" -o /tmp/qp29-overlay.json
          python <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("/tmp/qp29").resolve()
          obj=json.loads(Path("/tmp/qp29-overlay.json").read_text(encoding="utf-8"))
          assert obj["format"]=="QPPR29-DELTA-1"
          assert obj["base"]=="2209bf509affa0483dc5175e3e4116efcc850467"
          assert obj["head"]=="e6a74e8088a1e53bcbef62448b73732fbfb8b53a"
          assert len(obj["files"])==16
          for item in obj["files"]:
              rel=Path(item["path"])
              if rel.is_absolute() or ".." in rel.parts: raise RuntimeError(rel)
              data=item["content"].encode("utf-8")
              actual=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              if actual != item["sha"]:
                  raise RuntimeError(f"git blob mismatch: {rel} {actual} != {item['sha']}")
              p=(root/rel).resolve()
              if root not in p.parents: raise RuntimeError(rel)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(data)
          PY
          rm -f /tmp/qp29-overlay.json
          grep -Fq 'versionCode = 25' "$APP_DIR/app/build.gradle.kts"
          grep -Fq 'versionName = "3.3.2"' "$APP_DIR/app/build.gradle.kts"

      - name: Recover validated signing material
        shell: bash
        run: |
          set -euo pipefail
          cat .qpbuild/v321audit/chunk_*.b64 > /tmp/sign.enc.b64
          base64 --decode /tmp/sign.enc.b64 > /tmp/sign.enc
          rm /tmp/sign.enc.b64
          echo "a5c79b61ac957df471634f6ca39799dc75a1aff6e2804d6aa709ce1236ebc8ad  /tmp/sign.enc" | sha256sum -c -
          mkdir -p /tmp/signing
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in /tmp/sign.enc -out /tmp/sign.zip -pass file:/tmp/qp28.pass
          unzip -q /tmp/sign.zip -d /tmp/signing
          cp /tmp/signing/quickprint-release.p12 "$APP_DIR/"
          cp /tmp/signing/signing.env "$APP_DIR/"
          test -s "$APP_DIR/quickprint-release.p12"
          test -s "$APP_DIR/signing.env"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure signing
        shell: bash
        working-directory: /tmp/qp29
        run: |
          set -euo pipefail
          set -a; source signing.env; set +a
          echo "QP_KEYSTORE_PATH=$PWD/quickprint-release.p12" >> "$GITHUB_ENV"
          echo "QP_KEYSTORE_PASSWORD=$QP_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "QP_KEY_ALIAS=$QP_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "QP_KEY_PASSWORD=$QP_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release
        working-directory: /tmp/qp28
        run: gradle --no-daemon --stacktrace assembleRelease validateSigningRelease

      - name: Verify signed APK
        shell: bash
        working-directory: /tmp/qp28
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$BADGING" | grep -Fq "name='br.com.quickprint.os'"
          echo "$BADGING" | grep -Fq "versionCode='25'"
          echo "$BADGING" | grep -Fq "versionName='3.3.2'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "$EXPECTED_CERT_SHA256"
          cp "$APK" QuickPrintOS-PR29-v3.3.2-signed.apk
          sha256sum QuickPrintOS-PR28-v3.2.0-signed.apk | tee apk-sha256.txt
          printf 'pr=28\nhead=2209bf509affa0483dc5175e3e4116efcc850467\npackage=br.com.quickprint.os\nversionName=3.2.0\nversionCode=21\ncertificateSha256=%s\n' "$CERT" > apk-validation.txt
          rm -f /tmp/qp28.pass

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickPrintOS-PR29-v3.3.2-signed
          path: |
            /tmp/qp29/QuickPrintOS-PR29-v3.3.2-signed.apk
            /tmp/qp29/apk-sha256.txt
            /tmp/qp29/apk-signature.txt
            /tmp/qp29/apk-validation.txt
          if-no-files-found: error
          retention-days: 30
