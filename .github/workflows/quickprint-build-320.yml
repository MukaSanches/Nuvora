name: Quick Print OS 3.2 Signed Release

on:
  push:
    branches: [ "quickprint-build-relay" ]
    paths:
      - ".github/workflows/quickprint-build-320.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAYLOAD_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-7a38-820e-8add-f797c22915d7/raw?se=2026-09-20T21%3A12%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=c4385ecf-f6a5-5d5e-8234-c396ed3255de&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T20%3A09%3A08Z&ske=2026-09-21T20%3A09%3A08Z&sks=b&skv=2026-02-06&sig=oBcAXgla8DoC%2Bo6/xQ3gDX2FJIP1XbXd3dzhOEp0AtU%3D"
      PASSPHRASE_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-aa1c-820e-a629-be5716c9cec9/raw?se=2026-09-20T21%3A12%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=03965aaf-990b-5f2c-b3da-e3226140476b&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T13%3A56%3A39Z&ske=2026-09-21T13%3A56%3A39Z&sks=b&skv=2026-02-06&sig=i1u0rfATrNJ5yWu4iXXAYDSKa4kHfukqk/qf8m0YVnQ%3D"
      EXPECTED_PAYLOAD_SHA256: "7e0601a5542ad51087ea7dcd7c8acc2d9cc34740f67b905d7a042b1b5b678280"
      EXPECTED_CERT_SHA256: "29c27b8a9d6630416cbc6f366241c42fe69d6e5746d2ff768b745858a3810f71"

    steps:
      - uses: actions/checkout@v4

      - name: Download encrypted private build payload
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 1 "$PAYLOAD_URL" -o /tmp/qp320.enc
          curl -L --fail --retry 4 --retry-delay 1 "$PASSPHRASE_URL" -o /tmp/qp320.pass
          echo "$EXPECTED_PAYLOAD_SHA256  /tmp/qp320.enc" | sha256sum -c -
          test -s /tmp/qp320.pass

      - name: Decrypt source and signing material
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qp320"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000             -in /tmp/qp320.enc             -out /tmp/qp320.zip             -pass file:/tmp/qp320.pass
          unzip -q /tmp/qp320.zip -d "$RUNNER_TEMP/qp320"
          rm -f /tmp/qp320.enc /tmp/qp320.pass /tmp/qp320.zip
          test -s "$RUNNER_TEMP/qp320/app/build.gradle.kts"
          test -s "$RUNNER_TEMP/qp320/quickprint-release.p12"
          grep -Fq 'versionCode = 21' "$RUNNER_TEMP/qp320/app/build.gradle.kts"
          grep -Fq 'versionName = "3.2.0"' "$RUNNER_TEMP/qp320/app/build.gradle.kts"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 build tools
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure signing
        shell: bash
        working-directory: ${{ runner.temp }}/qp320
        run: |
          set -euo pipefail
          set -a
          source signing.env
          set +a
          echo "QP_KEYSTORE_PATH=$PWD/quickprint-release.p12" >> "$GITHUB_ENV"
          echo "QP_KEYSTORE_PASSWORD=$QP_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "QP_KEY_ALIAS=$QP_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "QP_KEY_PASSWORD=$QP_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Unit tests
        working-directory: ${{ runner.temp }}/qp320
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint release
        working-directory: ${{ runner.temp }}/qp320
        run: gradle --no-daemon lintRelease

      - name: Build and validate signed release
        working-directory: ${{ runner.temp }}/qp320
        run: gradle --no-daemon assembleRelease validateSigningRelease

      - name: Verify APK identity, archive and signature
        shell: bash
        working-directory: ${{ runner.temp }}/qp320
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -Fq "name='br.com.quickprint.os'"
          echo "$BADGING" | grep -Fq "versionCode='21'"
          echo "$BADGING" | grep -Fq "versionName='3.2.0'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "$EXPECTED_CERT_SHA256"
          cp "$APK" QuickPrintOS-v3.2.0-signed.apk
          sha256sum QuickPrintOS-v3.2.0-signed.apk | tee apk-sha256.txt
          {
            echo "package=br.com.quickprint.os"
            echo "versionName=3.2.0"
            echo "versionCode=21"
            echo "certificateSha256=$CERT"
            echo "$BADGING"
          } > apk-validation.txt

      - name: Upload signed APK and validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: QuickPrintOS-v3.2.0-signed
          path: |
            ${{ runner.temp }}/qp320/QuickPrintOS-v3.2.0-signed.apk
            ${{ runner.temp }}/qp320/apk-sha256.txt
            ${{ runner.temp }}/qp320/apk-signature.txt
            ${{ runner.temp }}/qp320/apk-validation.txt
            ${{ runner.temp }}/qp320/app/build/reports/tests/testDebugUnitTest/
            ${{ runner.temp }}/qp320/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 7
